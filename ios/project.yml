name: CurrencyConverter
options:
  bundleIdPrefix: com.currencyconvertor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

targets:
  CurrencyConverter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CurrencyConverter/App
      - path: CurrencyConverter/Models
      - path: CurrencyConverter/Engine
      - path: CurrencyConverter/Repository
      - path: CurrencyConverter/ViewModel
      - path: CurrencyConverter/Theme
      - path: CurrencyConverter/Views
      - path: CurrencyConverter/Resources/currencies.json
      - path: CurrencyConverter/Resources/seed-rates.json
      - path: CurrencyConverter/Resources/Fonts
      - path: CurrencyConverter/Resources/flags
        type: folder
      - path: CurrencyConverter/Resources/Localizations
      - path: CurrencyConverter/Assets.xcassets
    info:
      path: Generated/CurrencyConverter-Info.plist
      properties:
        CFBundleDisplayName: Currency Converter
        CFBundleLocalizations:
          - en
          - uz
          - ru
          - es
          - zh-Hans
          - ar
          - hi
          - pt
          - fr
          - de
          - ja
          - tr
          - it
          - ko
          - id
          - vi
          - th
          - fa
          - ur
          - bn
          - pl
          - uk
          - nl
          - ms
          - kk
          - ky
          - az
          - he
          - sv
          - ro
        UILaunchScreen: {}
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currencyconvertor.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CurrencyConverterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CurrencyConverterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currencyconvertor.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CurrencyConverter

  CurrencyConverterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CurrencyConverterUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currencyconvertor.app.uitests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CurrencyConverter

schemes:
  CurrencyConverter:
    build:
      targets:
        CurrencyConverter: all
        CurrencyConverterTests: [test]
        CurrencyConverterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CurrencyConverterTests
        - CurrencyConverterUITests
    archive:
      config: Release
